[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai"
version = "0.1.0"
description = "Local-first personal assistant MVP"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
voice = ["vosk>=0.3.45,<0.4", "piper-tts>=1.3,<2", "sounddevice>=0.5,<1"]

[project.scripts]
personal-ai = "personal_ai.cli:main"

[tool.setuptools.packages.find]
include = ["personal_ai*"]
